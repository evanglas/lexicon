<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 300px;
      }
      button {
        margin-top: 10px;
      }
      input[type="text"] {
        width: calc(100% - 100px);
      }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <div>
      <input type="text" id="api-key" placeholder="Enter API Key" />

    </div>
    <button id="open-word-list">Manage Word List</button>
    <script src="popup.js"></script>
  </body>
</html>
